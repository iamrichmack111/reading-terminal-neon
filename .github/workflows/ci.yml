name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile application
        run: python -m py_compile reading_terminal_neon.py

      - name: Verify portfolio media
        run: |
          test -f README.md
          test -f tools/capture.py
          test -f wiki/Home.md
